{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="page-card p-4">
            <h1 class="h4 text-center mb-1">Oyera Auto Service Bay</h1>
            <p class="text-muted text-center mb-4">Staff login</p>
            <form method="post" novalidate id="login-form">
                {% csrf_token %}
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <div class="mb-3">
                    <label class="form-label" for="username">Username or email</label>
                    <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-bay w-100">Login</button>
            </form>
            <p class="small text-muted mt-4 mb-2">Demo accounts — click one to fill the form, then Login:</p>
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-outline-dark demo-login" data-username="admin" data-password="OasAdmin1">
                    Admin (admin)
                </button>
                <button type="button" class="btn btn-outline-dark demo-login" data-username="james" data-password="OasSenior1">
                    Senior technician (james)
                </button>
                <button type="button" class="btn btn-outline-dark demo-login" data-username="mary" data-password="OasTech1">
                    Technician (mary)
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.querySelectorAll('.demo-login').forEach(function (button) {
    button.addEventListener('click', function () {
        document.getElementById('username').value = button.getAttribute('data-username');
        document.getElementById('password').value = button.getAttribute('data-password');
        document.getElementById('username').focus();
    });
});
</script>
{% endblock %}
