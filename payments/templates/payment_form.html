{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="page-card p-4">
            <h1 class="h4 mb-3">{{ title }}</h1>
            {% if note %}<p class="text-muted">{{ note }}</p>{% endif %}
            <form method="post" novalidate>
                {% csrf_token %}
                {% include 'includes/form_fields.html' %}
                <button class="btn btn-bay" type="submit">Save payment</button>
                <a href="{% url 'payment_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
